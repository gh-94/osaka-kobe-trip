name: Sync Giscus comments

on:
  workflow_dispatch:
  discussion:
    types: [created, edited, deleted]
  discussion_comment:
    types: [created, edited, deleted]

permissions:
  contents: write
  discussions: read

concurrency:
  group: sync-giscus-comments
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build comments.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          token=os.environ["GITHUB_TOKEN"]
          owner=os.environ["GITHUB_REPOSITORY_OWNER"]
          repo=os.environ["GITHUB_REPOSITORY"].split("/",1)[1]
          endpoint="https://api.github.com/graphql"
          query=r"""
          query($owner:String!,$repo:String!,$after:String){
            repository(owner:$owner,name:$repo){
              discussions(first:100,after:$after,orderBy:{field:UPDATED_AT,direction:DESC}){
                pageInfo{hasNextPage endCursor}
                nodes{
                  title url
                  comments(first:100){
                    nodes{
                      id url bodyText createdAt lastEditedAt author{login}
                      reactions(first:100){nodes{content}}
                      replies(first:100){
                        nodes{
                          id url bodyText createdAt lastEditedAt author{login}
                          reactions(first:100){nodes{content}}
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """
          def gql(vars):
            req=urllib.request.Request(endpoint,data=json.dumps({"query":query,"variables":vars}).encode(),headers={"Authorization":f"Bearer {token}","Content-Type":"application/json","User-Agent":"osaka-kobe-trip-comments-sync"})
            with urllib.request.urlopen(req) as r: out=json.load(r)
            if out.get("errors"): raise RuntimeError(out["errors"])
            return out["data"]
          def rx(nodes):
            out={}
            for n in nodes or []:
              k=n.get("content")
              if k: out[k]=out.get(k,0)+1
            return out
          places={};after=None
          while True:
            data=gql({"owner":owner,"repo":repo,"after":after})
            conn=data["repository"]["discussions"]
            for d in conn["nodes"]:
              m=re.match(r"^place:(P\d+)\s+\|\s+(.+)$",d["title"])
              if not m: continue
              pid=m.group(1);items=[]
              for c in d["comments"]["nodes"]:
                items.append({"id":c["id"],"author":(c.get("author") or {}).get("login") or "ghost","body":c.get("bodyText") or "","created_at":c["createdAt"],"edited_at":c.get("lastEditedAt"),"url":c["url"],"reactions":rx((c.get("reactions") or {}).get("nodes")),"is_reply":False})
                for r in (c.get("replies") or {}).get("nodes") or []:
                  items.append({"id":r["id"],"author":(r.get("author") or {}).get("login") or "ghost","body":r.get("bodyText") or "","created_at":r["createdAt"],"edited_at":r.get("lastEditedAt"),"url":r["url"],"reactions":rx((r.get("reactions") or {}).get("nodes")),"is_reply":True})
              items.sort(key=lambda x:x["created_at"])
              places[pid]={"title":d["title"],"discussion_url":d["url"],"count":len(items),"comments":items}
            if not conn["pageInfo"]["hasNextPage"]: break
            after=conn["pageInfo"]["endCursor"]
          with open("comments.json","w",encoding="utf-8") as f:
            json.dump({"schema_version":1,"source":"GitHub Discussions / Giscus","places":places},f,ensure_ascii=False,indent=2);f.write("\n")
          print("synced",sum(x["count"] for x in places.values()),"comments")
          PY

      - name: Commit comments.json if changed
        run: |
          if git diff --quiet -- comments.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comments.json
          git commit -m "Sync Giscus comments"
          git push
