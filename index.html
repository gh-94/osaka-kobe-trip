<style>
:root{--bg:#111315;--panel:#181b1f;--text:#f3f4f6;--muted:#a1a1aa;--line:#2b3036;--soft:#20242a;--accent:#f3f4f6;--mapNotice:rgba(24,27,31,.94);--shadow:#0008}
body.light{--bg:#f5f6f8;--panel:#fff;--text:#18181b;--muted:#71717a;--line:#e4e4e7;--soft:#fafafa;--accent:#111827;--mapNotice:rgba(255,255,255,.94);--shadow:#0003}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
html{color-scheme:dark}

body.light .themeBtn{background:#fff}

.app{display:grid;grid-template-columns:370px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.head{padding:13px 15px 11px;border-bottom:1px solid var(--line)}.head h1{font-size:19px;margin:0 0 4px}.sub{font-size:11px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.metric{padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.metric b{display:block;font-size:16px}.metric span{font-size:9px;color:var(--muted)}
.controls{padding:9px 11px;border-bottom:1px solid var(--line);display:grid;gap:6px}input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:var(--input);color:var(--text)}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px}.legend span{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:3px 6px;background:var(--panel)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.list{overflow:auto;padding:6px;max-height:calc(100vh - 290px)}.item{border:1px solid var(--line);border-radius:10px;padding:8px;margin:5px 0;background:var(--panel);cursor:pointer}.item.active{border-color:var(--bg)827;outline:2px solid #11182710}
.itop{display:flex;gap:7px}.cdot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}.title{font-size:13px;font-weight:680}.meta{font-size:10px;color:var(--muted);margin-top:3px}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.badge{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:2px 5px;background:var(--soft)}
.main{display:grid;grid-template-rows:minmax(300px,38vh) auto;gap:9px;padding:9px;min-width:0}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#e5e7eb}#map{width:100%;height:100%;min-height:300px}
.mapnotice{position:absolute;z-index:5;left:9px;top:9px;background:var(--mapNotice);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:10px;max-width:330px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;min-height:320px}
.hero{display:grid;grid-template-columns:minmax(220px,32%) minmax(0,1fr);gap:13px;align-items:start}
.photo{width:100%;aspect-ratio:4/3;border-radius:11px;overflow:hidden;background:linear-gradient(135deg,#eceff3,#d8dde5);display:grid;place-items:center;color:#777;font-size:11px;position:relative}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photoCredit{font-size:9px;color:var(--muted);margin-top:4px}
.detail h2{font-size:19px;margin:0}.decision{margin-top:9px;padding:9px 10px;background:var(--soft);border:1px solid var(--line);border-radius:9px;font-size:11.5px;line-height:1.55}
.detailsGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}.section{border-top:1px solid var(--line);padding-top:9px}.section h3{font-size:11px;margin:0 0 6px}.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 7px;font-size:11px;line-height:1.4}.k{color:var(--muted)}
.liveBox{border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:9px;background:var(--panel)}.liveTitle{font-weight:680;font-size:12px}.review{border-top:1px solid var(--line);padding-top:7px;margin-top:7px;font-size:10.5px;line-height:1.45}.reviewHead{font-weight:650;margin-bottom:3px}
.mapsbtn{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;text-decoration:none;border-radius:9px;padding:9px 11px;font-size:11px}.note{font-size:9.5px;color:var(--muted);line-height:1.45;margin-top:6px}
.mobileTabs{display:none}.gm-tooltip{font-size:11px;line-height:1.35;min-width:145px}.gm-tooltip b{font-size:12px}
.routeLabel{background:var(--panel);border:1px solid #111827;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:700;box-shadow:0 1px 5px #0002;white-space:nowrap}
@media(max-width:900px){
 body{padding-bottom:64px}.app{display:block}.side{border-right:0}.row{grid-template-columns:1fr}.list{max-height:none;overflow:visible;padding-bottom:80px}.main{display:block;padding:7px}.mapwrap{height:calc(100vh - 170px);min-height:430px}#map{min-height:100%}.detail{margin-top:7px}.hero{grid-template-columns:1fr}.photo{max-height:300px}.detailsGrid{grid-template-columns:1fr}

 body.mobile-map .side .list{display:none}body.mobile-map .main{display:block}body.mobile-list .main{display:none}
}

.nearbyPanel{margin-top:2px}

.commentPanelHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.commentPanelHead b{font-size:12px}
.commentClose{border:0;background:transparent;color:var(--muted);font-size:18px;padding:2px 5px}

function distanceKm(a,b){
 const R=6371,toRad=x=>x*Math.PI/180;
 const dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);

 const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
 return 2*R*Math.asin(Math.sqrt(h));
}

 // outline first so the path remains visible over both light and dark map tiles
 const outline=new google.maps.Polyline({path,map,strokeColor:edge,strokeOpacity:.92,strokeWeight:7,geodesic:true,zIndex:70});
 const line=new google.maps.Polyline({path,map,strokeColor:routeColor,strokeOpacity:1,strokeWeight:4,geodesic:true,zIndex:71,
   icons:[{icon:{path:google.maps.SymbolPath.FORWARD_CLOSED_ARROW,scale:3.4,strokeColor:routeColor,fillColor:routeColor,fillOpacity:1,strokeWeight:1.4},offset:'12%',repeat:'15%'}]});
 routeObjects.push(outline,line);
 pts.forEach(x=>{
   const m=new google.maps.Marker({position:{lat:x.lat,lng:x.lng},map,icon:routeHubIcon(x.label),zIndex:900,title:x.label});
   m.addListener('click',()=>showNearbyFromHub(x));
   routeObjects.push(m);
 });
}
function syncMarkers(a){const s=new Set(a.map(p=>p.id));markers.forEach((m,id)=>m.setMap(s.has(id)?map:null))}
function fitCurrent(){
 if(!map)return;
 const d=$('day').value;
 if(d && DAY_VIEW[d]){
   // 특정 날짜는 '당일 숙소/핵심 체류권'을 중심으로 과감하게 확대.
   map.setCenter(DAY_VIEW[d].center);
   map.setZoom(DAY_VIEW[d].zoom);
   return;
 }
 const a=filtered(),b=new google.maps.LatLngBounds();
 a.forEach(p=>b.extend({lat:p.location.latitude,lng:p.location.longitude}));
 if(!b.isEmpty()) map.fitBounds(b,38);
}
function render(){const a=filtered();renderList(a);if(map){syncMarkers(a);drawRoute($('day').value)}}
window.initMap=function(){map=new google.maps.Map($('map'),{center:{lat:34.6937,lng:135.5023},zoom:11,mapTypeControl:true,streetViewControl:false,fullscreenControl:true,gestureHandling:'greedy',styles:document.body.classList.contains('light')?[]:DARK_MAP_STYLE});hoverInfo=new google.maps.InfoWindow({disableAutoPan:true});PLACES.forEach(p=>{const m=new google.maps.Marker({position:{lat:p.location.latitude,lng:p.location.longitude},map,title:p.title,icon:{url:markerSvg(COLORS[p.category]||'#777'),scaledSize:new google.maps.Size(28,39),anchor:new google.maps.Point(14,38)}});m.addListener('click',()=>selectPlace(p.id,false));m.addListener('mouseover',()=>{if(window.matchMedia('(hover:hover)').matches){hoverInfo.setContent(`<div class="gm-tooltip"><b>${esc(p.title)}</b><br>${esc(p.category||'')} · ${esc(p.subCategory||'')}<br>${esc(p.region||'')} · 추천 ${esc(dl(p.day))}</div>`);hoverInfo.open({map,anchor:m})}});m.addListener('mouseout',()=>{if(window.matchMedia('(hover:hover)').matches)hoverInfo.close()});markers.set(p.id,m)});render();fitCurrent()};

function updateGiscusTheme(mode){
 const frame=document.querySelector('iframe.giscus-frame');
 if(frame) frame.contentWindow.postMessage({giscus:{setConfig:{theme:mode==='light'?'light':'dark_dimmed'}}},'https://giscus.app');
}
function applyTheme(mode){
 const light=mode==='light';
 document.body.classList.toggle('light',light);
 localStorage.setItem('trip-theme',light?'light':'dark');
 const b=$('themeBtn');if(b){b.textContent=light?'☾':'☀︎';b.title=light?'다크모드':'라이트모드'}
 if(map){map.setOptions({styles:light?[]:DARK_MAP_STYLE});drawRoute($('day').value)}
 updateGiscusTheme(light?'light':'dark');
}
