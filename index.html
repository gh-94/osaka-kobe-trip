<head>

<title>오사카·고베 여행 마스터 FINAL</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#18181b;--muted:#71717a;--line:#e4e4e7;--soft:#fafafa;--accent:#111827}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif}
button,input,select{font:inherit}
.app{display:grid;grid-template-columns:390px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.head{padding:16px;border-bottom:1px solid var(--line)}
.head h1{font-size:20px;margin:0 0 4px} .sub{font-size:12px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.metric{padding:8px;border:1px solid var(--line);border-radius:11px;background:var(--soft)} .metric b{display:block;font-size:17px} .metric span{font-size:10px;color:var(--muted)}
.controls{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--text)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:5px} .legend span{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:4px 6px;background:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.list{overflow:auto;padding:8px;max-height:calc(100vh - 330px)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0;background:#fff;cursor:pointer}
.item.active{border-color:#111827;outline:2px solid #11182710}
.itop{display:flex;gap:8px} .cdot{width:11px;height:11px;border-radius:50%;margin-top:4px;flex:none}
.title{font-size:14px;font-weight:650} .meta{font-size:11px;color:var(--muted);margin-top:3px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px} .badge{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:3px 6px;background:var(--soft)}
.main{display:grid;grid-template-rows:minmax(430px,62vh) auto;gap:12px;padding:12px;min-width:0}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#e5e7eb}
#map{width:100%;height:100%;min-height:430px}
.mapnotice{position:absolute;z-index:5;left:12px;top:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;max-width:340px}
.detail{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;min-height:250px}
.detail h2{font-size:19px;margin:0} .section{margin-top:14px} .section h3{font-size:12px;margin:0 0 7px}
.kv{display:grid;grid-template-columns:145px minmax(0,1fr);gap:6px 10px;font-size:12px} .k{color:var(--muted)}
.mapsbtn{display:inline-block;margin-top:12px;background:#111827;color:#fff;text-decoration:none;border-radius:10px;padding:10px 12px;font-size:13px}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}
.loading{display:grid;place-items:center;height:100%;color:#6b7280;text-align:center;padding:30px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.list{max-height:42vh}.main{grid-template-rows:430px auto}}
@media(max-width:520px){.row{grid-template-columns:1fr}.main{padding:8px;grid-template-rows:400px auto}#map{min-height:400px}.kv{grid-template-columns:110px minmax(0,1fr)}}
</style>
</head>

const COLORS={"음식점": "#e24d4d", "카페·디저트": "#df9338", "쇼핑": "#4177c9", "볼거리": "#7a59ba", "산책·공원": "#3f976a", "바·나이트라이프": "#cb4f89", "숙소": "#262626", "교통·편의": "#7a8590", "기타": "#8e8e8e"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const dayLabel=d=>({'2026-08-15':'8/15 토','2026-08-16':'8/16 일','2026-08-17':'8/17 월','2026-08-18':'8/18 화'}[d]||'미정');
let map=null, selected=null;
const markers=new Map();

function fmt(v){
 if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length))return '';
 if(Array.isArray(v))return v.join(', ');
 if(typeof v==='object')return JSON.stringify(v);
 if(v===true)return '가능';
 if(v===false)return '불가';
 return String(v);
}
function kv(rows){return `<div class="kv">${rows.filter(r=>fmt(r[1])).map(r=>`<div class="k">${esc(r[0])}</div><div>${esc(fmt(r[1]))}</div>`).join('')}</div>`}
function detailHtml(p){
 const l=p.location||{};
 return `<h2>${esc(p.title)}</h2>
 <div class="badges"><span class="badge">${esc(p.category||'')}</span><span class="badge">${esc(p.subCategory||'')}</span><span class="badge">${esc(dayLabel(p.day))}</span></div>
 <div class="badges">${(p.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div>
 <div class="section"><h3>기본</h3>${kv([['지역',p.region],['동선',p.route],['주소',p.identity.address||l.resolved_formatted_address],['전화',p.identity.phone],['Google 평점',p.identity.google_rating],['Google 리뷰수',p.identity.google_review_count],['좌표',`${l.latitude}, ${l.longitude}`]])}</div>
 <div class="section"><h3>리뷰/평가</h3>${kv([['타베로그',p.tabelog.score],['리뷰수',p.tabelog.review_count],['선정',p.tabelog.award_or_list],['리뷰 요약',p.reviews.summary],['장점',p.reviews.strengths],['단점',p.reviews.weaknesses]])}</div>
 <div class="section"><h3>예약/영업</h3>${kv([['예약 가능',p.reservation.available],['예약 필요도',p.reservation.required_level],['영업시간',p.hours.regular_hours],['예정일 영업',p.hours.planned_date_hours],['휴무',p.hours.regular_closed_days],['오봉 공지',p.hours.obon_2026_special_notice]])}</div>
 <div class="section"><h3>메뉴/웨이팅</h3>${kv([['대표 메뉴',p.menu.signature_items],['추천 메뉴',p.menu.recommended_items],['예상 예산',p.menu.expected_budget_jpy_per_person],['웨이팅',p.waiting.level],['피크 대기',p.waiting.typical_peak_wait]])}</div>
 <div class="section"><h3>여행 메모</h3>${kv([['우선순위',p.trip.priority],['이유',p.trip.priority_reason],['용도',p.trip.best_use]])}</div>
 <a class="mapsbtn" href="${esc(p.mapsUrl)}" target="_blank" rel="noopener">Google Maps에서 열기 ↗</a>`;
}
function initFilters(){
 [...new Set(PLACES.map(p=>p.category).filter(Boolean))].sort().forEach(v=>$('cat').insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));
 [...new Set(PLACES.map(p=>p.region).filter(Boolean))].sort().forEach(v=>$('region').insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));
 [...new Set(PLACES.flatMap(p=>p.tags||[]))].sort().forEach(v=>$('tag').insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));
 Object.entries(COLORS).forEach(([k,v])=>$('legend').insertAdjacentHTML('beforeend',`<span><i class="dot" style="background:${v}"></i>${esc(k)}</span>`));
}
function updateSubs(){
 const cat=$('cat').value,old=$('subcat').value;
 const vals=[...new Set(PLACES.filter(p=>!cat||p.category===cat).map(p=>p.subCategory).filter(Boolean))].sort();
 $('subcat').innerHTML='<option value="">전체 세부분류</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');
 if(vals.includes(old))$('subcat').value=old;
}
function filtered(){
 const q=$('q').value.trim().toLowerCase();
 return PLACES.filter(p=>{
  const hay=[p.title,p.region,p.route,p.category,p.subCategory,...(p.tags||[])].join(' ').toLowerCase();
  const d=$('day').value;
  return (!q||hay.includes(q))&&(!d||(d==='none'?!p.day:p.day===d))&&(!$('cat').value||p.category===$('cat').value)&&(!$('subcat').value||p.subCategory===$('subcat').value)&&(!$('region').value||p.region===$('region').value)&&(!$('tag').value||(p.tags||[]).includes($('tag').value));
 });
}
function renderList(arr){
 $('count').textContent=arr.length;
 $('list').innerHTML=arr.map(p=>`<div class="item ${selected===p.id?'active':''}" data-id="${p.id}"><div class="itop"><i class="cdot" style="background:${COLORS[p.category]||'#888'}"></i><div><div class="title">${esc(p.title)}</div><div class="meta">${esc(dayLabel(p.day))} · ${esc(p.region||'')} · ${esc(p.route||'')}</div><div class="badges"><span class="badge">${esc(p.category||'')}</span><span class="badge">${esc(p.subCategory||'')}</span></div></div></div></div>`).join('');
 document.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>selectPlace(el.dataset.id,true)));
}
function selectPlace(id,pan){
 selected=id;
 const p=PLACES.find(x=>x.id===id); if(!p)return;
 $('detail').innerHTML=detailHtml(p);
 document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
 if(pan&&map&&markers.has(id)){map.panTo(markers.get(id).getPosition());map.setZoom(Math.max(map.getZoom(),15));}
}
function markerSvg(color){
 return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="30" height="42" viewBox="0 0 30 42"><path fill="${color}" stroke="white" stroke-width="2" d="M15 1C7.4 1 1.3 7.2 1.3 14.8c0 10.5 13.7 25.7 13.7 25.7s13.7-15.2 13.7-25.7C28.7 7.2 22.6 1 15 1z"/><circle cx="15" cy="14" r="5" fill="white"/></svg>`);
}
function syncMarkers(arr){
 const visible=new Set(arr.map(p=>p.id));
 markers.forEach((m,id)=>m.setMap(visible.has(id)?map:null));
}
function fitCurrent(){
 if(!map)return;
 const arr=filtered();
 const b=new google.maps.LatLngBounds();
 arr.forEach(p=>b.extend({lat:p.location.latitude,lng:p.location.longitude}));
 if(!b.isEmpty()) map.fitBounds(b,40);
}
function render(){
 const arr=filtered();renderList(arr);if(map)syncMarkers(arr);
}
window.initMap=function(){
 map=new google.maps.Map($('map'),{
  center:{lat:34.6937,lng:135.5023},zoom:11,
  mapTypeControl:true,streetViewControl:false,fullscreenControl:true,
  gestureHandling:'greedy'
 });
 PLACES.forEach(p=>{
  const m=new google.maps.Marker({
   position:{lat:p.location.latitude,lng:p.location.longitude},
   map,
   title:p.title,
   icon:{url:markerSvg(COLORS[p.category]||'#777'),scaledSize:new google.maps.Size(30,42),anchor:new google.maps.Point(15,41)}
  });
  m.addListener('click',()=>selectPlace(p.id,false));
  markers.set(p.id,m);
 });
 fitCurrent();
 render();
};
initFilters();updateSubs();render();
$('cat').addEventListener('change',()=>{updateSubs();render()});
['q','day','subcat','region','tag'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));
$('fit').addEventListener('click',fitCurrent);
</script>
