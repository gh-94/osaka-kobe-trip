<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오사카·고베 3박4일</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#0f1216;--card:#181c22;--card2:#1e242c;--line:#2a313a;--text:#e8eaed;--muted:#9aa4b0;--accent:#ff7a59;--accent2:#5ac8fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.65;overscroll-behavior-y:none}
body{-webkit-text-size-adjust:100%;height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.head{flex:none;max-width:900px;width:100%;margin:0 auto;padding:60px 16px 0;box-sizing:border-box}
.head h1{font-size:16px;margin:2px 0 1px}
.head .sub{color:var(--muted);font-size:11.5px;margin-bottom:8px}
.tabbar{flex:none;background:var(--bg);border-bottom:1px solid var(--line);padding:0 16px}
.tabs{max-width:900px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.12s;touch-action:manipulation;user-select:none}
.tab:hover{border-color:var(--accent)}
.tab.active{background:var(--accent);color:#1a1206;border-color:var(--accent)}
.body{flex:1 1 auto;min-height:0;max-width:900px;width:100%;margin:0 auto;position:relative}
.pane{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 80px;box-sizing:border-box}
.pane.active{display:block}
.pane.iframe-pane{padding:12px 16px 16px}
#doc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px}
#doc h1{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:10px}
#doc h2{font-size:18px;color:var(--accent2);margin-top:28px}
#doc h3{font-size:15.5px;margin-top:20px}
#doc p,#doc li{font-size:14.5px}
#doc code{background:var(--card2);padding:2px 5px;border-radius:5px;font-size:13px}
#doc table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0;display:block;overflow-x:auto}
#doc th,#doc td{border:1px solid var(--line);padding:6px 9px;text-align:left}
#doc th{background:var(--card2);color:var(--accent2)}
#doc blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:4px 14px;background:var(--card2);border-radius:0 8px 8px 0;color:var(--muted)}
#doc hr{border:none;border-top:1px solid var(--line);margin:24px 0}
#doc strong{color:#fff}
#doc a{color:var(--accent2)}
.loading{color:var(--muted);text-align:center;padding:40px}
/* 회화 카드 (일본어 문장 줄바꿈 방지 + 가로스크롤, 발음은 불릿) */
#doc .pcat{color:var(--accent2);font-size:13px;font-weight:700;margin:22px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
#doc .pnote{font-size:12.5px;color:var(--muted);margin:6px 0 14px}
#doc .pcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0}
#doc .pcard .pk{font-weight:700;font-size:14px;color:#fff;margin-bottom:5px}
#doc .pcard .pj{font-size:16px;color:var(--accent2);white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:3px;margin-bottom:7px}
#doc .pcard .pj::-webkit-scrollbar{display:none}
#doc .pcard .pp{margin:0;padding-left:17px;font-size:12.5px;color:var(--muted);line-height:1.55}
#doc .pcard .pp li{margin:1px 0}
#doc .pcard .pp li b{color:var(--text);font-weight:600}
#toTop{position:fixed;right:16px;bottom:22px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#1a1206;border:none;font-size:19px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;cursor:pointer;touch-action:manipulation}
#toTop.show{display:flex}
/* 우선순위 뱃지 */
.pselect-wrap{position:relative;display:inline-block;vertical-align:middle;margin-left:6px}
.pselect-wrap::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:9px;color:inherit;pointer-events:none}
.pselect{appearance:none;-webkit-appearance:none;-moz-appearance:none;border:1px solid var(--line);outline:none;font-size:11px;font-weight:700;padding:3px 24px 3px 10px;border-radius:99px;background:var(--card2);color:var(--muted);cursor:pointer;touch-action:manipulation;max-width:150px}
.pselect.v-go{background:#b45309;color:#fff;border-color:transparent}
.pselect.v-maybe{background:#0e7490;color:#fff;border-color:transparent}
.pselect.v-ok{background:#4b5563;color:#fff;border-color:transparent}
.pselect.v-meh{background:#5b1f1f;color:#fff;border-color:transparent}
.pbtn{display:inline-block;border:1px solid var(--line);background:var(--card2);color:var(--accent2);border-radius:99px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;margin:14px 8px 0 0;touch-action:manipulation}
.pbtn.danger{color:#f87171}
.pinfo{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(90,200,250,.15);border:1px solid rgba(90,200,250,.4);color:var(--accent2);margin-left:6px;cursor:pointer;vertical-align:middle;touch-action:manipulation;white-space:nowrap;user-select:none}
/* 바텀시트 */
#sheetBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
#sheetBackdrop.show{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;height:82vh;background:var(--card);border-radius:18px 18px 0 0;z-index:91;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s ease;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
#sheet.show{transform:translateY(0)}
#sheetHead{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
#sheetHead .stitle{font-size:13.5px;font-weight:700;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetClose{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;touch-action:manipulation;flex:none}
.sheetNav{background:var(--card2);border:1px solid var(--line);color:var(--accent2);border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;touch-action:manipulation;flex:none}
.sheetNav[disabled]{opacity:.3;pointer-events:none}
.sheetNav.hide{display:none}
#sheetCounter{font-size:11.5px;color:var(--muted);flex:none;white-space:nowrap}
#sheetBody{flex:1;min-height:0}
#sheetBody iframe{width:100%;height:100%;border:none}
#sheetGrip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0}
iframe.planner{width:100%;height:100%;min-height:480px;border:1px solid var(--line);border-radius:16px;background:var(--card);display:block}
@media (max-width:480px){
  .head h1{font-size:17px}
  .tab{padding:8px 12px;font-size:13px}
  #doc{padding:18px 15px}
  #doc h1{font-size:19px}
}
</style>
</head>
<body>
<div class="head">
  <h1>🎡 오사카·고베 3박4일</h1>
  <div class="sub">2026-08-15(토) ~ 08-18(화) · 2인 · 탭을 눌러 이동</div>
</div>
<div class="tabbar">
  <div class="tabs" id="tabs">
    <div class="tab" data-tab="index">✅ 체크리스트</div>
    <div class="tab" data-tab="day1">DAY1</div>
    <div class="tab" data-tab="planner1">🗺 Day1 플래너</div>
    <div class="tab" data-tab="day2">DAY2</div>
    <div class="tab" data-tab="planner">🗺 Day2 플래너</div>
    <div class="tab" data-tab="day3">DAY3</div>
    <div class="tab" data-tab="planner3">🗺 Day3 플래너</div>

    <div class="tab" data-tab="planner4">🗺 Day4 플래너</div>

<div class="body">
  <div class="pane" data-pane="index"><div class="loading">불러오는 중…</div></div>
  <div class="pane" data-pane="day1"><div class="loading">불러오는 중…</div></div>
  <div class="pane" data-pane="day2"><div class="loading">불러오는 중…</div></div>
  <div class="pane" data-pane="day3"><div class="loading">불러오는 중…</div></div>
  <div class="pane" data-pane="day4"><div class="loading">불러오는 중…</div></div>
  <div class="pane iframe-pane" data-pane="planner4">
    <iframe class="planner" src="./day4_planner.html" title="Day4 플래너"></iframe>
  </div>
  <div class="pane" data-pane="context"><div class="loading">불러오는 중…</div></div>
  <div class="pane" data-pane="phrases"><div class="loading">불러오는 중…</div></div>

  <div class="pane iframe-pane" data-pane="planner1">

<button id="toTop" aria-label="맨 위로">↑</button>

<div id="sheetBackdrop"></div>
<div id="sheet">
  <div id="sheetGrip"></div>
  <div id="sheetHead">
    <button id="sheetPrev" class="sheetNav" aria-label="이전">◀</button>
    <span class="stitle" id="sheetTitle">장소 정보</span>
    <span id="sheetCounter"></span>

    <button id="sheetClose" aria-label="닫기">✕</button>
  </div>

<script>
const FILES = {
  index: '00_trip_index_checklist.md',
  day1: 'day1_osaka_master.md',
  day2: 'day2_osaka_master.md',
  day3: 'day3_kobe_master.md',
  day4: 'day4_kobe_master.md',
  context: 'context_osaka.md',
  phrases: 'japanese_phrases.md'
};
const loaded = {};
const VALID_TABS = ['index','day1','planner1','day2','planner','day3','planner3','day4','planner4','context','phrases','priority','map'];

function loadMd(key){
  if(loaded[key]) return Promise.resolve();
  const pane = document.querySelector(`.pane[data-pane="${key}"]`);
  return fetch('./' + FILES[key])
    .then(r => { if(!r.ok) throw new Error('파일을 찾을 수 없습니다: ' + FILES[key]); return r.text(); })
    .then(md => { pane.innerHTML = '<div id="doc">' + marked.parse(md) + '</div>'; loaded[key] = true; tagPlaceIds(pane); })
    .catch(err => { pane.innerHTML = '<p style="color:#f87171">' + err.message + '</p>'; });
}

/* ===== 우선순위 태깅 (P번호 드롭다운) ===== */
const PKEY = 'osaka_trip_priority_v1';
const PORDER = ['go', 'maybe', 'ok', 'meh'];
const PSTATE_LABEL = { 'go': '🔥 꼭 가보자', 'maybe': '👍 가능하면 가보자', 'ok': '🤔 나쁘지 않을지도', 'meh': '😶 그냥그냥' };
const PLACE_REGISTRY = {}; // pid -> label (모든 문서를 훑어서 등록되는 전체 장소 목록)

function loadPriorities(){ try { return JSON.parse(localStorage.getItem(PKEY) || '{}'); } catch(e){ return {}; } }
function savePriorities(obj){ try { localStorage.setItem(PKEY, JSON.stringify(obj)); } catch(e){} }

function setPriority(pid, label, value){
  const data = loadPriorities();
  if (!value) delete data[pid];
  else data[pid] = { v: value, label: label };
  savePriorities(data);
}

function paintSelect(sel, value){
  sel.className = 'pselect' + (value ? ' v-' + value : '');
}

function tagPlaceIds(root){
  const heads = root.querySelectorAll('h2, h3');
  heads.forEach((h) => {
    if (h.dataset.ptagged) return;
    const allIds = [...h.textContent.matchAll(/P\d{3}/g)].map((m) => m[0]);
    if (allIds.length === 0) return;
    const pid = allIds[0];
    h.dataset.ptagged = '1';
    const label = h.textContent.trim();
    PLACE_REGISTRY[pid] = label;
    const stored = loadPriorities()[pid];
    const curVal = stored ? stored.v : '';

    const wrap = document.createElement('span');
    wrap.className = 'pselect-wrap';
    const sel = document.createElement('select');
    sel.className = 'pselect';
    const optNone = document.createElement('option');
    optNone.value = ''; optNone.textContent = '순위 선택';
    sel.appendChild(optNone);
    PORDER.forEach((key) => {
      const opt = document.createElement('option');
      opt.value = key; opt.textContent = PSTATE_LABEL[key];
      sel.appendChild(opt);
    });
    sel.value = curVal;
    paintSelect(sel, curVal);
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', () => {
      setPriority(pid, label, sel.value);
      paintSelect(sel, sel.value);
    });
    wrap.appendChild(sel);

    const infoBtn = document.createElement('span');
    infoBtn.className = 'pinfo';
    infoBtn.textContent = allIds.length > 1 ? `📍 정보(${allIds.length})` : '📍 정보';
    infoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openSheet(allIds, label);
    });

    h.appendChild(document.createTextNode(' '));
    h.appendChild(infoBtn);
    h.appendChild(wrap);
  });
}

/* ===== 장소 상세 바텀시트 (여러 P번호면 좌우 이동) ===== */
const sheetEl = document.getElementById('sheet');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetFrame = document.getElementById('sheetFrame');
const sheetTitle = document.getElementById('sheetTitle');
const sheetCounter = document.getElementById('sheetCounter');
const sheetPrev = document.getElementById('sheetPrev');
const sheetNext = document.getElementById('sheetNext');
let sheetIds = [];
let sheetIndex = 0;

function renderSheetFrame(){
  const pid = sheetIds[sheetIndex];
  sheetFrame.src = `./index.html?place=${pid}&view=map&embed=1`;
  const multi = sheetIds.length > 1;
  sheetPrev.classList.toggle('hide', !multi);
  sheetNext.classList.toggle('hide', !multi);
  sheetCounter.textContent = multi ? `${pid} · ${sheetIndex + 1}/${sheetIds.length}` : pid;
}
function openSheet(ids, label){
  sheetIds = Array.isArray(ids) ? ids : [ids];
  sheetIndex = 0;
  sheetTitle.textContent = label;
  renderSheetFrame();
  sheetBackdrop.classList.add('show');
  sheetEl.classList.add('show');
}
function closeSheet(){
  sheetBackdrop.classList.remove('show');
  sheetEl.classList.remove('show');
  setTimeout(() => { sheetFrame.src = 'about:blank'; }, 300);
}
sheetPrev.addEventListener('click', () => { sheetIndex = (sheetIndex - 1 + sheetIds.length) % sheetIds.length; renderSheetFrame(); });
sheetNext.addEventListener('click', () => { sheetIndex = (sheetIndex + 1) % sheetIds.length; renderSheetFrame(); });
sheetBackdrop.addEventListener('click', closeSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);

function renderPrioritySummary(){
  const data = loadPriorities();
  const order = PORDER;
  const titles = PSTATE_LABEL;
  const groups = { 'go': [], 'maybe': [], 'ok': [], 'meh': [] };
  Object.keys(data).forEach((pid) => { groups[data[pid].v].push({ pid, label: data[pid].label }); });
  const unrated = Object.keys(PLACE_REGISTRY).filter((pid) => !data[pid]).map((pid) => ({ pid, label: PLACE_REGISTRY[pid] }));

  let html = '<div id="doc"><h1>⭐ 우리 둘의 우선순위</h1>';
  html += '<div class="pcat">📖 사용법</div>';
  html += '<div class="pcard">';
  html += '<div class="pk">1. DAY1~4 탭에서 장소 제목을 읽고, 제목 옆 <b>드롭다운(순위 선택 ▾)</b>을 눌러 하나 고르세요.</div>';
  html += '</div>';
  html += '<div class="pcard">';
  html += '<div class="pk">2. 제목 옆 <b>📍 정보</b> 버튼을 누르면 지도·상세정보가 화면 아래에서 뜹니다. 번호가 여러 개면 ◀▶로 넘겨보고, 바깥 어두운 부분이나 ✕로 닫으세요.</div>';
  html += '</div>';
  html += '<div class="pcard">';
  html += '<div class="pk">3. 여기 "⭐ 우선순위" 탭에서 매긴 결과가 등급별로 모여요. 아직 안 매긴 곳은 "➖ 미표기"에 접혀 들어가요.</div>';
  html += '</div>';
  html += '<div class="pcard">';
  html += '<div class="pk">4. 저장은 <b>이 기기(브라우저)에만</b> 남아요 — 상대방과 자동 동기화 안 됨. 각자 다 매긴 뒤 <b>"📋 순위 목록 복사하기"</b>로 카톡 등에 붙여넣어 서로 비교하세요.</div>';
  html += '</div>';
  html += '<div class="pnote">Day1~4 전체를 취합해서 보여줘요.</div>';
  let any = false;
  order.forEach((key) => {
    if (groups[key].length === 0) return;
    any = true;
    html += `<div class="pcat">${titles[key]} (${groups[key].length}곳)</div>`;
    groups[key].forEach((item) => {
      html += `<div class="pcard"><div class="pk">${item.label.replace(/</g, '&lt;')}</div></div>`;
    });
  });
  if (!any) html += '<p style="color:var(--muted);font-size:14px">아직 매긴 순위가 없어요. DAY1~4 탭에서 장소 제목 옆 드롭다운을 눌러보세요.</p>';
  if (unrated.length > 0) {
    html += `<details style="margin-top:14px"><summary style="cursor:pointer;color:var(--muted);font-size:13px;font-weight:700">➖ 미표기 (${unrated.length}곳) — 탭하여 펼치기</summary>`;
    unrated.forEach((item) => {
      html += `<div class="pcard"><div class="pk">${item.label.replace(/</g, '&lt;')}</div></div>`;
    });
    html += '</details>';
  }
  html += '<button class="pbtn" id="copyPriority">📋 순위 목록 복사하기</button>';
  html += '<button class="pbtn danger" id="resetPriority">🗑 전체 초기화</button>';
  html += '</div>';

  const view = document.getElementById('priorityView');
  view.innerHTML = html;
  document.getElementById('copyPriority').addEventListener('click', copyPrioritySummary);
  document.getElementById('resetPriority').addEventListener('click', () => {
    if (confirm('정말 전체 순위를 초기화할까요? (이 기기 기준)')) {
      localStorage.removeItem(PKEY);
      renderPrioritySummary();
      document.querySelectorAll('.pselect').forEach((s) => { s.value = ''; paintSelect(s, ''); });
    }
  });
}

function copyPrioritySummary(){
  const data = loadPriorities();
  const order = PORDER;
  const titles = { 'go': '🔥 꼭 가보자', 'maybe': '👍 가능하면 가보자', 'ok': '🤔 나쁘지 않을지도', 'meh': '😶 그냥그냥' };
  let text = '🎡 오사카·고베 여행 우선순위 (Day1~4 전체 취합)\n';
  order.forEach((key) => {
    const items = Object.keys(data).filter((pid) => data[pid].v === key);
    if (items.length === 0) return;
    text += `\n[${titles[key]}]\n`;
    items.forEach((pid) => { text += `- ${data[pid].label}\n`; });
  });
  const unrated = Object.keys(PLACE_REGISTRY).filter((pid) => !data[pid]);
  if (unrated.length > 0) {
    text += `\n[➖ 미표기]\n`;
    unrated.forEach((pid) => { text += `- ${PLACE_REGISTRY[pid]}\n`; });
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => alert('복사됐어요! 카톡 등에 붙여넣기 하시면 됩니다.'),
      () => window.prompt('아래 텍스트를 직접 복사하세요:', text)
    );
  } else {
    window.prompt('아래 텍스트를 직접 복사하세요:', text);
  }
}

// 탭 전환 시 iframe(플래너·지도)은 DOM에서 제거되지 않고 display만 바뀌므로
// 내부 상태(스크롤 위치, 지도 확대/선택 등)가 그대로 유지됩니다.
// md 문서 탭도 각자 자신만의 overflow-y 스크롤 영역을 갖고 있어
// 다른 탭을 봤다가 돌아와도 스크롤 위치가 유지됩니다.
function activate(key){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === key));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.dataset.pane === key));
  if(FILES[key]) loadMd(key);
  if(key === 'priority'){
    // 우선순위 탭은 Day1~4를 전부 취합해서 보여줘야 하므로, 아직 안 열어본 탭까지 미리 백그라운드로 로드
    Promise.all(Object.keys(FILES).map((k) => loadMd(k))).then(renderPrioritySummary);
  }
  history.replaceState(null, '', '#' + key);
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => activate(t.dataset.tab));
});

const initial = (location.hash || '#index').slice(1);
activate(VALID_TABS.includes(initial) ? initial : 'index');

// 맨 위로 버튼: 각 탭(md 문서)은 자기만의 스크롤 영역이라 iOS 상태바 탭으로는 안 올라감 → 대체 버튼 제공
const toTopBtn = document.getElementById('toTop');
document.querySelectorAll('.pane').forEach((pane) => {
  pane.addEventListener('scroll', () => {
    if (pane.classList.contains('active')) {
      toTopBtn.classList.toggle('show', pane.scrollTop > 300);
    }
  });
});
toTopBtn.addEventListener('click', () => {
  const active = document.querySelector('.pane.active');
  if (active) active.scrollTo({ top: 0, behavior: 'smooth' });
});
document.querySelectorAll('.tab').forEach((t) => {
  t.addEventListener('click', () => toTopBtn.classList.remove('show'));
});

// 오프라인 대비: 화면엔 아무것도 안 보이지만, 인터넷 켜진 상태로 페이지를 열면
// 조용히 백그라운드에서 문서·플래너를 캐싱해둠. 이후 인터넷 없어도 그대로 열림(사진·지도 제외).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body></html>
