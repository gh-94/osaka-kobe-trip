<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오사카·고베 여행 문서</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#0f1216;--card:#181c22;--card2:#1e242c;--line:#2a313a;--text:#e8eaed;--muted:#9aa4b0;--accent:#ff7a59;--accent2:#5ac8fa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.65}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 80px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.topbar a{color:var(--accent2);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--card2)}
.topbar a:hover{border-color:var(--accent)}
#doc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px}
#doc h1{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:10px}
#doc h2{font-size:18px;color:var(--accent2);margin-top:28px}
#doc h3{font-size:15.5px;margin-top:20px}
#doc p,#doc li{font-size:14.5px}
#doc code{background:var(--card2);padding:2px 5px;border-radius:5px;font-size:13px}
#doc table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0;display:block;overflow-x:auto}
#doc th,#doc td{border:1px solid var(--line);padding:6px 9px;text-align:left}
#doc th{background:var(--card2);color:var(--accent2)}
#doc blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:4px 14px;background:var(--card2);border-radius:0 8px 8px 0;color:var(--muted)}
#doc hr{border:none;border-top:1px solid var(--line);margin:24px 0}
#doc strong{color:#fff}
#doc a{color:var(--accent2)}
.loading{color:var(--muted);text-align:center;padding:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="./docs.html">📚 전체 목록</a>
    <a href="./index.html">🗺 지도로 보기</a>
  </div>
  <div id="doc"><div class="loading">불러오는 중…</div></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const file = params.get('file') || '00_trip_index_checklist.md';
fetch('./' + file)
  .then(r => { if(!r.ok) throw new Error('파일을 찾을 수 없습니다: ' + file); return r.text(); })
  .then(md => { document.getElementById('doc').innerHTML = marked.parse(md); document.title = file.replace('.md',''); })
  .catch(err => { document.getElementById('doc').innerHTML = '<p style="color:#f87171">'+err.message+'</p>'; });
</script>
</body></html>
